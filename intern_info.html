<!DOCTYPE html>
<html>
<head>
    <title>Intern Management - Intern Information</title>

    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #c4c9c3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        form {
            width: 450px;
            padding: 30px;
            background-color: rgb(210, 205, 224);
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        input, button {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <form action="interntable.php" method="POST">

        <h2>Intern Information</h2>

        <label for="username">Full Name:</label>
        <input type="text"
               id="username"
               name="username"
               required>

        <label for="dob">Date Of Birth:</label>
        <input type="date"
               id="dob"
               name="dob"
               required>

        <label for="gender">Gender:</label>
        <input type="text"
               id="gender"
               name="gender"
               required>

        <label for="phone">Phone:</label>
        <input type="text"
               id="phone"
               name="phone"
               required>

        <label for="address">Address:</label>
        <input type="text"
               id="address"
               name="address"
               required>

        <label for="university">University:</label>
        <input type="text"
               id="university"
               name="university"
               required>

        <label for="end_date">End Date:</label>
        <input type="date"
               id="end_date"
               name="end_date"
               required>

        <label for="status">Status:</label>
        <input type="text"
               id="status"
               name="status"
               value="Active"
               required>

        <button type="submit"
                name="sub"
                value="sub">
            Submit
        </button>

    </form>

</body>
</html>
