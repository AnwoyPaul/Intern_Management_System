<!DOCTYPE html>
<html>
<head>
    <title>Intern Management - Intern Information</title>

    <style>
        body {
                font-family: 'Times New Roman', Times, serif;
                background-color: #c4c9c3;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                margin: 0;
            }

        form {
            width: 450px;
            padding: 30px;
            background-color: rgb(210, 205, 224);
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        input, select, button {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 16px;
        }

        input, select {
            background-color: white;
            border: 1px solid #999;
            border-radius: 0;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
        }

        select {
            height: 62px;
        }
    </style>
</head>

<body>

    <form action="interntable.php" method="POST">

        <h2>Intern Information</h2>

        <label for="username">Full Name:</label>
        <input type="text"
               id="username"
               name="username"
               required>

        <label for="dob">Date Of Birth:</label>
        <input type="date"
               id="dob"
               name="dob"
               required>

        

         <div class="form-group">
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <label for="phone">Phone:</label>
        <input type="text"
               id="phone"
               name="phone"
               required>

        <label for="address">Address:</label>
        <input type="text"
               id="address"
               name="address"
               required>

        <label for="university">University:</label>
        <input type="text"
               id="university"
               name="university"
               required>

        <label for="start_date">Start Date:</label>
        <input type="date"
               id="start_date"
               name="start_date"
               required>

        <label for="end_date">End Date:</label>
        <input type="date"
               id="end_date"
               name="end_date"
               required>

        <label for="status">Status:</label>
        <input type="text"
               id="status"
               name="status"
               value="Active"
               required>

        <button type="submit"
                name="sub"
                value="sub">
            Submit
        </button>

    </form>

</body>
</html>
